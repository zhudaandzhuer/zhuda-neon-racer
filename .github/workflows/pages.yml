name: Verify and publish Neon Apex
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-apex-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # The full-quality harbor is intentionally expensive on CPU-only runners.
    # Keep the rendered checks and give software rasterization enough time.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zhudaandzhuer/zhuda-laya-engine
          ref: 74b04064208f8afe624896482d7bc438dd15dc29
          path: .engine
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build pinned public engine SDK
        working-directory: .engine
        run: npm install && npm run build
      - name: Typecheck, build and simulate all circuits
        env:
          ZHUDA_ENGINE_ROOT: ${{ github.workspace }}/.engine
        run: npm run typecheck && npm run build && npm test
      - name: Verify live WebGL gameplay and saved progress
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run verify:browser
      - name: Verify actual HDR, material, reflection and teardown behavior
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run verify:visual
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-apex-verification
          path: evidence/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified game
        id: deployment
        uses: actions/deploy-pages@v4
